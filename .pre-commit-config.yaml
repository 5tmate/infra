repos:
  - repo: local
    hooks:
      - id: opa-test
        name: IMDSv2 policy tests
        entry: opa test policy/imdsv2 --fail-on-empty
        language: system
        files: ^policy/imdsv2/.*\.rego$
        pass_filenames: false

      - id: imdsv2
        name: IMDSv2 enforced on every EC2 resource
        entry: python3 policy/check.py
        language: system
        always_run: true
        pass_filenames: false
