server:
  listenAddress: ":443"
  exposedAddress: "https://__DOMAIN__:443"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: "127.0.0.1:9000"
  logLevel: "info"
  logFile: "console"

  tls:
    letsencrypt:
      enabled: true
      dataDir: "/var/lib/netbird/letsencrypt"
      domains:
        - "__DOMAIN__"
      email: "admin@__ZONE_NAME__"
      awsRoute53: true

  authSecret: "__AUTH_SECRET__"
  dataDir: "/var/lib/netbird"

  auth:
    issuer: "https://__DOMAIN__/oauth2"
    signKeyRefreshEnabled: true
    sessionCookieEncryptionKey: "__SESSION_KEY__"
    dashboardRedirectURIs:
      - "https://__ADMIN_DOMAIN__/nb-auth"
      - "https://__ADMIN_DOMAIN__/nb-silent-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"

  store:
    engine: sqlite
    encryptionKey: "__ENCRYPTION_KEY__"
