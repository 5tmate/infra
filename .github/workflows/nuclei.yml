name: Nuclei

on:
  push:
    branches: [main]
    paths:
      - 'nuclei/**'
  pull_request:
    branches: [main]
    paths:
      - 'nuclei/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: nuclei/src/lambda/go.sum

      - name: Build lambda zip
        working-directory: nuclei/src/lambda
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/bootstrap .
          (cd dist && zip -q lambda.zip bootstrap)

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_NUCLEI }}
          aws-region: ap-northeast-1

      - name: Login and get passphrase
        run: bash scripts/get-passphrase.sh nuclei

      - uses: pulumi/actions@v6
        with:
          command: ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
          stack-name: prod
          work-dir: nuclei
